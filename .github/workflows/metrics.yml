name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Uses METRICS_TOKEN when present (full account stats), else the repo-scoped default.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: arvind2602
          filename: github-metrics.svg
          template: classic
          # Repo-level sections only requested when a full-account token is available.
          base: ${{ secrets.METRICS_TOKEN != '' && 'header, activity, community, repositories, metadata' || 'header, activity, community, metadata' }}
          config_timezone: Asia/Kolkata
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: ${{ secrets.METRICS_TOKEN != '' && 'yes' || 'no' }}
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_achievements: ${{ secrets.METRICS_TOKEN != '' && 'yes' || 'no' }}
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C

  languages:
    needs: github-metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate languages.svg
        env:
          GH_USER: arvind2602
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-languages.mjs
      - name: Commit languages.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || git commit -m "Update languages.svg"
          git pull --rebase origin main
          git push
