name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Uses METRICS_TOKEN when present (full account stats), else the repo-scoped default.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: arvind2602
          filename: github-metrics.svg
          template: classic
          # Repo-level sections are only requested when a full-account token is available.
          base: ${{ secrets.METRICS_TOKEN != '' && 'header, activity, community, repositories, metadata' || 'header, activity, community, metadata' }}
          config_timezone: Asia/Kolkata
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: ${{ secrets.METRICS_TOKEN != '' && 'yes' || 'no' }}
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_achievements: ${{ secrets.METRICS_TOKEN != '' && 'yes' || 'no' }}
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
